$mod = SUPER
$terminal = kitty
$menu = wofi --show drun
$files = thunar

# Keybinds
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, pkill wofi || $menu
bind = $mod, E, exec, $files
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, R, exec, ~/.config/waybar/scripts/reload.sh
bind = $mod, L, exec, hyprlock
bind = $mod, W, exec, ~/.config/hypr/scripts/wall.sh next
bind = $mod, X, exec, ~/.config/waybar/scripts/power-menu.sh
# bind = $mod SHIFT, E, exec, 

# Focus and workspaces
bind = $mod CTRL, left, movefocus, l
bind = $mod CTRL, right, movefocus, r
bind = $mod CTRL, up, movefocus, u
bind = $mod CTRL, down, movefocus, d

bind = ALT, 1, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALT, 4, workspace, 4
bind = ALT, 5, workspace, 5

bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5

# Minimize active window to special workspace
bind = $mod, M, movetoworkspace, special:minimized

# Show/hide minimized windows
bind = $mod, V, togglespecialworkspace, minimized

# Mouse: move/resize windows
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots
bind = , Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = CTRL, Print, exec, grim -g "$(slurp)" - | wl-copy

# Volume and brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# TEMP
bind = $mod, L, exec, hyprlock
