# Font
# font_family      family='Fira Code' postscript_name=FiraCode-Regular
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size        13.0

adjust_line_height 1

# Cursor
cursor_shape     block
cursor_blink_interval -1
cursor_shape_unfocused hollow
cursor_trail 5

# Window
remember_window_size yes
initial_window_width 110c
initial_window_height 32c
window_padding_width 12
hide_window_decorations no
background_opacity 0.55
background_blur 1

# Shell
shell /usr/bin/zsh
enable_audio_bell no
confirm_os_window_close 0

# Scrolling
scrollback_lines 10000
wheel_scroll_multiplier 3.0
scrollbar scrolled

# Autumn Forest — Kitty Colors

background          #292622
foreground          #E8DCC8
cursor               #D9A066
selection_background #A65E2E
selection_foreground #FFF1DC

# Normal colors
color0  #352F29
color1  #C75B39
color2  #89945A
color3  #D5A44D
color4  #A87952
color5  #B47A68
color6  #7F9990
color7  #D8CBB6

# Bright colors
color8  #62564A
color9  #E07850
color10 #A5AD6B
color11 #E8BC69
color12 #C29268
color13 #CE9580
color14 #A0B2A0
color15 #F0E7DA

# Tabs
tab_bar_edge bottom
tab_bar_style powerline

active_tab_foreground #292622
active_tab_background #D5A44D

inactive_tab_foreground #B9AA96
inactive_tab_background #3A332C

# Performance
repaint_delay 8
input_delay 3
# font_family Victor Mono 
# bold_font auto
# italic_font auto
# bold_italic_font auto


# BEGIN_KITTY_FONTS
font_family      family="Hack"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
