# Font
# font_family      family='Fira Code' postscript_name=FiraCode-Regular
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size        14.0

adjust_line_height 0

# Cursor
cursor_shape     block
cursor_blink_interval -1
cursor_shape_unfocused hollow
cursor_trail 5

# Window
remember_window_size yes
initial_window_width 110c
initial_window_height 32c
window_padding_width 12
hide_window_decorations no
background_opacity 0.75
background_blur 1

# Shell
shell /usr/bin/zsh
enable_audio_bell no
confirm_os_window_close 0

# Scrolling
scrollback_lines 10000
wheel_scroll_multiplier 3.0
scrollbar scrolled

background #292622
foreground #F0E7DA
cursor #C6A77B
selection_background #C6A77B
selection_foreground #51483D

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# Tabs
tab_bar_edge bottom
tab_bar_style powerline
active_tab_foreground #1e1e2e
active_tab_background #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #313244

# Performance
repaint_delay 8
input_delay 3


# BEGIN_KITTY_FONTS
font_family      family="Noto Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
