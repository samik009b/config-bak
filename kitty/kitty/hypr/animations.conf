# General animation curves
bezier = easeOutQuint, 0.23, 1, 0.32, 1
bezier = easeInOutCubic, 0.65, 0, 0.35, 1
bezier = easeOutCubic, 0.33, 1, 0.68, 1
bezier = linear, 0, 0, 1, 1

# Global animation settings
animation = global, 1, 10, easeOutQuint

# Windows
animation = windows, 1, 5, easeOutQuint
animation = windowsIn, 1, 4, easeOutCubic, popin 85%
animation = windowsOut, 1, 3, easeOutCubic, popin 85%
animation = windowsMove, 1, 4, easeOutCubic

# Fading
animation = fade, 1, 4, easeOutCubic
animation = fadeIn, 1, 3, easeOutCubic
animation = fadeOut, 1, 3, easeOutCubic

# Workspaces
animation = workspaces, 1, 6, easeInOutCubic, slide
animation = workspacesIn, 1, 5, easeOutCubic, slide
animation = workspacesOut, 1, 5, easeOutCubic, slide

# Layers and special windows
animation = layers, 1, 4, easeOutCubic
animation = layersIn, 1, 3, easeOutCubic, fade
animation = layersOut, 1, 3, easeOutCubic, fade

# Special workspaces (scratchpads)
animation = specialWorkspace, 1, 5, easeOutCubic, slidevert

