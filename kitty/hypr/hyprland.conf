monitor = , preferred, auto, 1

$mod = SUPER
$terminal = kitty
$menu = wofi --show drun
$files = thunar

# Autostart
exec-once = /usr/bin/waybar
exec-once = mako
exec-once = hyprpaper
exec-once = nm-applet --indicator
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --watch cliphist store
exec-once = hypridle
exec-once = /home/samikb/.config/hypr/scripts/wall.sh

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(ffffff00)
    col.inactive_border = rgba(45475aff)
    layout = dwindle
}

# Sources
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/decoration.conf

# Qt theming
env = QT_QPA_PLATFORMTHEME,qt6ct

# Cursor
 env = XCURSOR_THEME,breeze_cursors
 env = XCURSOR_SIZE, 25
