general {
    hide_cursor = true
    ignore_empty_input = false
    fail_timeout = 1000
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    # color = rgba(255, 255, 255, 0.2)
    blur_size = 7
    noise = 0
    contrast = 0.6
    brightness = 0.6
    vibrancy = 0.1
    vibrancy_darkness = 0.2
}

# Large clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255,255,255, 0.4)
    font_size = 100
    font_family = JetBrainsMono Nerd Font
    position = 0, 350
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(255,255,255, 0.4)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 260
    halign = center
    valign = center
}

# Card background (spans x: -300 to 300, y: -110 to 110)
shape {
    monitor =
    size = 600, 320
    color = rgba(0, 0, 0, 0.3)
    rounding = 24
    border_size = 2
    border_color = rgba(20, 0, 0, 0)
    position = 0, 0
    halign = center
    valign = center
}

# User avatar (left)
image {
    monitor =
    path = ~/Pictures/cat.png
    size = 140
    rounding = -1
    border_size = 0
    border_color = rgb(cba6f7)
    position = -180, 0
    halign = center
    valign = center
}

# Username (right, top)
label {
    monitor =
    text = Greetings <span font_weight='800'>$USER</span>
    color = rgb(cdd6f4)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 70, 40
}

# Password input (right, bottom)
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(0, 0, 0, 0.2)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgb(cdd6f4)
    fade_on_empty = false
    rounding = 16
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    placeholder_text = <span foreground="##a6adc8">Type your password...</span>
    hide_input = false
    position = 70, -30
    halign = center
    valign = center
}
